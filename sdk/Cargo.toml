[package]
name = "lpad-sdk"
version = "0.2.0"
edition = "2024"
description = "SDK for building Logos modules that interact with the LPAD launchpad (bonding curve + LBP), public and private (deshield->buy->re-shield) paths."

[lib]
name = "lpad_sdk"

[dependencies]
bonding_curve_core = { path = "../programs/bonding_curve/core" }
lbp_core = { path = "../programs/lbp/core" }
wlez_core = { path = "../programs/wlez/core" }
# lpad's own three programs, as committed reproducible artifacts. This replaces
# the old runtime ELF lookup (LPAD_BC_ELF / target-relative paths): image ids are
# now compile-time constants, identical on every machine, so the CLI can no
# longer submit against a program id that disagrees with what was deployed.
lpad_guests = { path = "../programs", features = ["artifacts"] }
# The canonical upstream token / ATA / authenticated-transfer programs, also as
# committed artifacts. `artifacts` is mandatory and not a default feature.
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", default-features = false, features = [
    "artifacts",
] }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
ata_core = { package = "associated_token_account_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = [
    "host",
] }
# Online (wallet-backed) layer - build/sign/submit txs + read chain state.
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = [
    "client"
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Silence the wallet's stdout chatter so it never corrupts the CLI's (possibly
# --json) stdout. v0.2.1 prints considerably more than rc4 did: sync_to_block
# logs per-block progress and calls store_persistent_data (which prints) on every
# block, and decode_insert_privacy_preserving_transaction_results prints each
# decoded account.
gag = "1"
