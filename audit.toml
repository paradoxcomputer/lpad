# cargo-audit configuration for LPAD.
#
# Usage (cargo-audit does not auto-read a project-root config - pass it):
#   cargo audit -c audit.toml -f programs/Cargo.lock
#   cargo audit -c audit.toml -f sdk/Cargo.lock
#   cargo audit -c audit.toml -f cli/Cargo.lock
#
# Every advisory ignored below is reached ONLY transitively - through the
# vendored LEZ stack (_lez/), the logos-blockchain networking crates, or the
# RISC Zero build-time toolchain. `cargo tree -i <crate>` confirms NONE are
# introduced by lpad's own crates (bonding_curve / lbp / sdk / cli), so there is
# nothing to fix in this repo; remediation belongs to those upstream owners.
# Re-review this list whenever the LEZ pin (v0.2.0-rc4) is bumped.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa 0.9.x Marvin timing sidechannel - via rzup -> risc0-build (build-time tool, not a runtime signing path)
    "RUSTSEC-2026-0118", # hickory-proto 0.25.0-alpha DNS DoS - via the logos-blockchain libp2p networking stack
    "RUSTSEC-2026-0119", # hickory-proto 0.25.0-alpha DNS DoS - via the logos-blockchain libp2p networking stack
    "RUSTSEC-2026-0002", # lru 0.12.5 unsoundness - transitive via the vendored stack
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained - transitive
    "RUSTSEC-2025-0055", # tracing-subscriber < 0.3.20 ANSI log injection - transitive (fix is an upstream bump to >=0.3.20)
    "RUSTSEC-2024-0388", # derivative unmaintained - transitive
    "RUSTSEC-2024-0436", # paste unmaintained - transitive
]
