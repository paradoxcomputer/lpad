[package]
name = "lpad-cli"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "lpad"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
owo-colors = "4"
lpad-sdk = { path = "../sdk" }
bonding_curve_core = { path = "../programs/bonding_curve/core" }
lbp_core = { path = "../programs/lbp/core" }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = [
    "host",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
# Integration tests compute expected quotes/PDAs from the same on-chain libs
# the CLI uses, and parse the binary's JSON output.
bonding_curve_core = { path = "../programs/bonding_curve/core" }
lbp_core = { path = "../programs/lbp/core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = [
    "host",
] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
