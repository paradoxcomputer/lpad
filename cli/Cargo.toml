[package]
name = "lpad-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lpad"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
owo-colors = "4"
lpad-sdk = { path = "../sdk" }
bonding_curve_core = { path = "../programs/bonding_curve/core" }
lbp_core = { path = "../programs/lbp/core" }
token_core = { path = "../programs/token/core" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", features = ["host"] }
# Online (wallet-backed) layer - build/sign/submit txs + read chain state.
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", features = ["client"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
# Integration tests compute expected quotes/PDAs from the same on-chain libs
# the CLI uses, and parse the binary's JSON output.
bonding_curve_core = { path = "../programs/bonding_curve/core" }
lbp_core = { path = "../programs/lbp/core" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", features = ["host"] }
serde_json = "1"

[patch."https://github.com/logos-blockchain/logos-execution-zone.git"]
# Path-relative to the `_lez` symlink that setup.sh creates at the repo root.
nssa_core = { path = "../_lez/nssa/core" }
nssa = { path = "../_lez/nssa" }
wallet = { path = "../_lez/wallet" }
common = { path = "../_lez/common" }

[profile.release]
opt-level = 3
lto = "thin"
