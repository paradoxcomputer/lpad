[package]
name = "token_core"
# 0.1.1 (not 0.1.0) so this vendored copy is a distinct lockfile entry from the
# rc4 LEZ `token_core` that the wallet now also pulls in - same public API, the
# two never cross types, so the version skew just disambiguates the lockfile.
version = "0.1.1"
edition = "2021"

[dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", features = ["host"] }
spel-framework-macros = { git = "https://github.com/logos-co/spel.git", rev = "6473ab4c400bc59bac8db83a286faaeafa7d1999", package = "spel-framework-macros" }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
