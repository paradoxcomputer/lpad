[package]
name = "wlez_program"
version = "0.1.0"
edition = "2024"

[dependencies]
# See the note in ../bonding_curve/Cargo.toml on why `host` is not enabled here.
lee_core = { workspace = true }
wlez_core = { workspace = true }
token_core = { workspace = true }
# v0.2.1 gave the authenticated-transfer program a real `Instruction` enum; under
# rc4 its instruction was a bare u128. The chained native-transfer leg in
# `wrap::wrap` must encode the enum or the callee mis-deserializes it.
authenticated_transfer_core = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
risc0-zkvm = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
