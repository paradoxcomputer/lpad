# Workspace root AND the `lpad_guests` package, mirroring upstream's
# `lez/programs` layout: the package owns one `[[bin]]` per program (the zkVM
# guest entrypoints) and its library re-exports the built ELFs as `Program`s.
#
# Two disjoint feature sets, exactly as upstream:
#   * `programs` - pulls the program crates in and enables the `[[bin]]` guest
#     entrypoints. Used by `cargo risczero build` to cross-compile the ELFs.
#   * `artifacts` - the library target, embedding the already-built ELFs from
#     `artifacts/lpad/*.bin` and deriving their image ids.
# They must never be active together: with `artifacts` on, the guest build would
# try to embed the very `.bin` files it is producing. This is also why
# `artifacts` is not a default feature (upstream: risc0#3772).
[package]
name = "lpad_guests"
version = "0.3.0"
edition = "2024"

[lib]
name = "lpad_guests"
path = "src/lib.rs"

[[bin]]
name = "bonding_curve"
path = "bonding_curve/src/main.rs"
required-features = ["programs"]

[[bin]]
name = "lbp"
path = "lbp/src/main.rs"
required-features = ["programs"]

[[bin]]
name = "wlez"
path = "wlez/src/main.rs"
required-features = ["programs"]

[features]
artifacts = ["dep:lee", "dep:risc0-binfmt"]
programs = [
    "dep:lee_core",
    "dep:risc0-zkvm",
    "dep:borsh",
    "dep:bonding_curve_core",
    "dep:bonding_curve_program",
    "dep:lbp_core",
    "dep:lbp_program",
    "dep:wlez_core",
    "dep:wlez_program",
]

[dependencies]
lee = { workspace = true, optional = true }
lee_core = { workspace = true, optional = true }
risc0-zkvm = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
bonding_curve_core = { workspace = true, optional = true }
bonding_curve_program = { workspace = true, optional = true }
lbp_core = { workspace = true, optional = true }
lbp_program = { workspace = true, optional = true }
wlez_core = { workspace = true, optional = true }
wlez_program = { workspace = true, optional = true }

[build-dependencies]
# Pinned exactly, like `risc0-zkvm` below, because this crate is what turns a
# committed guest ELF into its image id - and that id IS the on-chain program
# address. A caret range let the three workspaces resolve it independently
# (programs/ was on 3.0.5 while cli/ and sdk/ were on 3.0.4), so a future patch
# release that changed the hashing would have silently given the CLI a different
# program id from the one the tests assert. The ids agree today; the pin is what
# keeps that from being luck.
risc0-binfmt = { version = "=3.0.5", optional = true }

# Guest build profile.
#
# `cargo risczero build` runs `cargo build --release` inside the pinned
# container against THIS manifest, which is the workspace root - so keys here
# are honoured in full. Until now there was no `[profile]` section at all, so
# the guests were built on cargo's stock release profile: 16 codegen units, no
# LTO, symbols left in.
#
# The forcing function was the deploy wall. A guest `.bin` is a RISC0
# `ProgramBinary` (`R0BF`) wrapping a user ELF plus the fixed v1compat kernel
# ELF, and that user ELF was carrying a full `.symtab` + `.strtab` - 235,990
# bytes on `bonding_curve`, ~40% of the file. None of it sits in a PT_LOAD
# segment, so none of it is ever mapped, executed or proven, but ALL of it goes
# into the deploy transaction, and the sequencer rejects any transaction over
# `max_block_size - 200` = 614,200 bytes. Both launchpads were over that wall
# and could not be deployed at all.
#
# Measured effect of this section (deploy tx = ELF + a 5-byte envelope):
#
#   guest          before    after   deploy tx   margin under 614,200
#   bonding_curve  619,484  335,304    335,309              278,891
#   lbp            622,996  345,812    345,817              268,383
#   wlez           449,480  236,692    236,697              377,503
#
# Guest SIZE and guest CYCLES are different currencies and the second one is
# the scarce one - proving is this project's bottleneck, and risc0's
# `DEFAULT_SEGMENT_LIMIT_PO2 = 20` puts a hard cliff at 1,048,576 cycles per
# segment; crossing it roughly doubles the proof work for that operation. So
# every key here was chosen to move BOTH in the right direction, and was
# measured rather than assumed:
#
# The last two columns are how much a future change may GROW that instruction
# before it spills into a second segment - the number any later size/speed
# trade has to be judged against, and the reason this profile is worth keeping:
#
#   execution              before      after    delta   growth left: was -> now
#   bc / Buy              773,456    712,541    -7.9%       35.6% ->  47.2%
#   bc / CreateSale       722,949    671,158    -7.2%       45.0% ->  56.2%
#   bc / BuyDisposable    617,907    567,000    -8.2%       69.7% ->  84.9%
#   lbp / Buy             701,036    644,819    -8.0%       49.6% ->  62.6%
#   lbp / CreateSale      807,781    745,820    -7.7%       29.8% ->  40.6%
#
# `lbp / CreateSale` is the tightest and stays tightest; every execution is
# still one segment.
#
#   * `strip` is pure profit: it removes only non-loadable sections, so it
#     cannot change a single executed instruction (measured on its own: cycles
#     moved <0.05%). It is what turned an undeployable guest into a deployable
#     one.
#   * `lto = "fat"` + `codegen-units = 1` is where the cycle win comes from.
#     A quarter of `.text` was panic/format decoration - `core::fmt`,
#     `rustc_demangle` + `backtrace_rs::print`, and `core::num::flt2dec` float
#     formatting - none of which a zkVM guest can ever reach; cross-crate
#     inlining collapses much of it and tightens the u128 curve math at the
#     same time.
#
# Do NOT reach for `opt-level = "z"` if the file grows again. It suppresses
# inlining in exactly the u128 paths that dominate these guests, so it buys
# bytes with the expensive currency - and after this section there are ~270 KB
# of headroom, so there is nothing to buy.
#
# Gates this profile must keep passing, all re-checked when it changed:
#   * Byte-reproducibility. Built twice in the pinned container from a clean
#     target dir; all three `.bin`s came back byte-identical. (The `cargo
#     vendor` fallback in `scripts/build-guests.sh` is still NOT reproducible
#     against this - see the note on `deployed` in `src/lib.rs`.)
#   * risc0's `-C passes=lower-atomic` must still fire. Disassembly of all
#     three guests contains zero `lr.w`/`sc.w`/`amo*.w`.
#   * `RISC0_SKIP_BUILD=1 cargo test --workspace`, whose integration tests
#     execute these very ELFs.
#
# NOTE for anyone profiling: `RISC0_PPROF_OUT` needs guest symbols, so build
# with `CARGO_PROFILE_RELEASE_STRIP=none` for a profileable ELF with identical
# code.
#
# Two things that are deliberately NOT set, having been checked rather than
# assumed:
#
#   * `panic`. risc0-build force-feeds `-C panic=abort` through
#     `CARGO_ENCODED_RUSTFLAGS`, appended after cargo's own arguments, so it
#     wins over anything written here: `panic = "abort"` would be a no-op and
#     `panic = "unwind"` would be silently overridden. Guest `assert!` -> abort
#     -> `LeeError::ProgramExecutionFailed` carrying the guest's own message,
#     which is what the integration tests assert on, is unchanged.
#
#   * `overflow-checks` / `debug-assertions`. These are OFF today and this
#     section deliberately leaves them off. With no `[profile]` section the
#     guests built on the stock release profile, where both default to false -
#     confirmed in the binaries, which contain no "attempt to * with overflow"
#     string at all. So there is nothing here to "keep enabled", and switching
#     them on would not be a safety no-op: it is a BEHAVIOUR change to money
#     math, turning a silent wrap into a revert inside dependency code that has
#     never been executed under checks, and it costs both bytes and cycles.
#     lpad's own arithmetic does not depend on the profile for this - it is
#     explicit (`checked_*` / `saturating_*` at 57 sites across the three
#     programs, and a hard `assert!`, never `debug_assert!`, for every bound
#     that must revert; there is not one `debug_assert!` in guest source). If
#     they are ever turned on it must be its own reviewed, separately measured
#     change, not a side effect of a size fix.
#
# One side effect worth knowing: this profile also governs HOST release builds
# of this workspace, so `cargo build --release` here yields stripped host
# binaries (thinner backtraces). The workspace is libraries plus guest bins, and
# cli/ and sdk/ are separate workspaces, so nothing user-facing is affected.

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[workspace]
members = [
    "bonding_curve/core",
    "bonding_curve",
    "lbp/core",
    "lbp",
    "wlez/core",
    "wlez",
    "integration_tests",
]
resolver = "2"

[workspace.dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
# Upstream LEZ programs as committed reproducible artifacts. `artifacts` is
# mandatory and deliberately not a default feature upstream, so every consumer
# must name it explicitly.
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", default-features = false, features = [
    "artifacts",
] }
# Canonical token / ATA / authenticated-transfer core types. lpad used to vendor
# hardened forks of token and ATA; v0.2.1 ships both as committed artifacts with
# machine-independent image ids, so the forks are gone and the ATA recipient
# contract those forks enforced is now re-asserted by lpad's own callers.
# `ata_core` keeps its short local name via a package rename so call sites are
# untouched.
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
ata_core = { package = "associated_token_account_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }
authenticated_transfer_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4" }

bonding_curve_core = { path = "bonding_curve/core" }
bonding_curve_program = { path = "bonding_curve" }
lbp_core = { path = "lbp/core" }
lbp_program = { path = "lbp" }
wlez_core = { path = "wlez/core" }
wlez_program = { path = "wlez" }

serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.0", features = ["derive"] }
# Guests need only the bare no_std zkVM runtime, and lpad's host side never
# proves (the prover lives in the sequencer), so default features stay off.
# Upstream v0.2.1 does the same - which is why lpad no longer has to patch a
# local checkout to drop the bonsai/ring dependency that cannot cross-compile
# to riscv32.
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde_json = "1.0"
tokio = { version = "1.28.2", features = [
    "net",
    "rt-multi-thread",
    "sync",
    "macros",
] }
