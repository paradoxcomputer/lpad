[package]
name = "bonding_curve-guest"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "bonding_curve"
path = "src/bin/bonding_curve.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "6473ab4c400bc59bac8db83a286faaeafa7d1999", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
bonding_curve_core = { path = "../../core" }
bonding_curve_program = { path = "../..", package = "bonding_curve_program" }
token_core = { path = "../../../token/core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }

# Route nssa_core through the local LEZ checkout (_lez) so the guest inherits its
# risc0-zkvm config: default-features off, dropping the host-only prover/client
# tooling (rzup, reqwest -> rustls -> ring) that can't cross-compile to riscv32
# (`-m64`). The guest only needs the no_std zkVM runtime; remote proving is unused.
[patch."https://github.com/logos-blockchain/logos-execution-zone.git"]
nssa_core = { path = "../../../../_lez/nssa/core" }
