[package]
name = "ata_core"
# 0.1.1 (not 0.1.0) so lpad's vendored ata_core is a distinct lockfile entry from
# the rc4 wallet's ata_core (LP-0014 ATA tooling) - same as the token_core bump.
# Same API; the two never cross types (the SDK only calls derivation helpers).
version = "0.1.1"
edition = "2021"

[dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0-rc4", features = ["host"] }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
