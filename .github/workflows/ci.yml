name: ci

on:
  push:
    branches: [main]
  pull_request:

# Public, GitHub-hosted gate: builds + runs the pure pricing-math core crates
# (host-only - no zkVM guests, no risc0 toolchain, no sequencer). The full
# unit + IDL-drift + standalone/real-proof E2E runs on a self-hosted `lez`
# runner via .github/workflows/e2e.yml.
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: clone the LEZ at the pinned tag (satisfies the `_lez` path-patch)
        run: git clone --depth 1 --branch v0.2.0-rc4 https://github.com/logos-blockchain/logos-execution-zone.git _lez
      - uses: dtolnay/rust-toolchain@stable
      - name: core pricing-math unit + property tests
        working-directory: programs
        run: cargo test -p bonding_curve_core -p lbp_core
